# Paramètres FastCGI communs à tous les sites Symfony (à inclure dans le bloc « location index.php »,
# après fastcgi_pass). Le code est toujours monté sur /var/www/html dans les conteneurs PHP,
# quel que soit le dossier servi par nginx : SCRIPT_FILENAME est donc exprimé côté PHP.
fastcgi_split_path_info ^(.+\.php)(/.*)$;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
fastcgi_param DOCUMENT_ROOT /var/www/html/public;
fastcgi_param PATH_INFO $fastcgi_path_info;

fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
