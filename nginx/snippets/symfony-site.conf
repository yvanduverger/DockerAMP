# Réglages communs à tous les sites Symfony (à inclure dans chaque bloc « server »,
# APRÈS le bloc « location index.php » : nginx teste les locations regex dans l'ordre).
index index.php;

location / {
    try_files $uri /index.php$is_args$args;
}

location ~ \.php$ {
    return 404;
}

client_max_body_size 64M;
